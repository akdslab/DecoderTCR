[project]
name = "DecoderTCR"
version = "1.5.0"
description = "DecoderTCR scoring, profiling, and peptide design by exact model ID"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.10.0",
  "safetensors>=0.5",
  "numpy>=2.2",
  "pandas>=2.2",
  "pyarrow>=19",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "tqdm>=4.67",
  "einops>=0.8",
  "jsonschema>=4.23",
  "stitchr==1.3.1",
  "huggingface-hub>=1.0",
  "matplotlib>=3.10",
  "logomaker>=0.8"
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.11",
  "build>=1.2",
  "hatchling>=1.27"
]

[project.scripts]
decodertcr = "DecoderTCR.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/DecoderTCR", "src/esm", "src/esmc"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/bundle.schema.json" = "DecoderTCR/schemas/bundle.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["artifact: requires explicitly selected real checkpoints"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/esm", "src/esmc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM"]
